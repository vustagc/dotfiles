# -*- conf -*-
[main]
include=/usr/share/foot/themes/zenburn

term=xterm-256color
font=IoskeleyMono:size=14
initial-color-theme=light

[cursor]
style=beam

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.99

[colors-light]
alpha=0.99

